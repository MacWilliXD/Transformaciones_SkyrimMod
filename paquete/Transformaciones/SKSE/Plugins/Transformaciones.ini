[General]
; Tecla que abre y cierra el menú, en código DIK decimal.
; 87 = F11. No uses 67 (F9): en Skyrim carga la partida rápida.
Tecla=87

[Servidor]
; 1: el menú no te transforma, le pide la transformación al servidor de SkyMP, que la aplica a todos
; (también a ti): ves lo mismo que los demás. Hace falta transformaciones-sync.js y estar conectado.
; 0: te transforma aquí mismo, sin servidor (para probar sin conectarte; los demás no lo ven).
Modo=1

[Ocultar]
; Razas que no salen en el menú, por su EditorID, separadas por comas. Sirve para las que te
; dejan quieto: el EditorID sale en Transformaciones.log al transformarte ("Transformar en ...").
; Por ejemplo: Razas=ChickenRace, HareRace
Razas=
